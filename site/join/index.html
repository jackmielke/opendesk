<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a team on OpenDesk</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1016;color:#E9EAF0;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}code{font:700 32px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em}a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:12px;background:#8E85FA;color:#0E1016;font-weight:600;text-decoration:none}p{color:#9A9DAC;max-width:34ch}</style>
</head><body><div><h1>You're invited</h1><p>Your team code is</p><code id="c">—</code><p>Open OpenDesk and it will ask you to sign in, then join you to the team.</p><a id="open" href="opendesk://join">Open OpenDesk</a></div>
<script>
var code = new URLSearchParams(location.search).get('code') || '';
document.getElementById('c').textContent = code || '—';
var target = 'opendesk://join?code=' + encodeURIComponent(code);
document.getElementById('open').href = target;
if (code) location.replace(target);
</script></body></html>
